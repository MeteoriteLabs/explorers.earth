name: explorers-music-fixture

x-music-labels: &music-labels
  com.explorers.music.fixture: "true"
  com.explorers.music.project: "explorers-music-fixture"

x-tunes-fixture-image: &tunes-fixture-image
  image: explorers-music-fixture-tunes:c3

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: music_fixture
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music_fixture"]
      interval: 2s
      timeout: 3s
      retries: 20
    labels: *music-labels
    networks: [music-fixture]
    volumes: [music-fixture-postgres:/var/lib/postgresql/data]

  strapi:
    image: node:22.12-alpine
    working_dir: /workspace
    command: ["node", "--experimental-strip-types", "tunes/scripts/music-fixture-server.ts", "--port", "1337"]
    ports: ["127.0.0.1:${MUSIC_STRAPI_HOST_PORT:-51337}:1337"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:1337/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 20
    labels: *music-labels
    networks: [music-fixture]
    volumes: [./:/workspace:ro]

  tunes-migrate:
    <<: *tunes-fixture-image
    command: ["node", "dist/server/deployment/run-migration-gate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://music:music@postgres:5432/music_fixture
      MUSIC_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MUSIC_IMAGE_COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MUSIC_MIGRATION_MARKER: 0004_identity_delete_saga
      MUSIC_GATE_ATTESTATION_KEY: fixture-migration-gate-key-at-least-32-characters
      MUSIC_GATE_ATTESTATION_PATH: /deployment-gates/fixture.json
    depends_on:
      postgres: { condition: service_healthy }
    labels: *music-labels
    networks: [music-fixture]
    volumes: [music-fixture-gates:/deployment-gates]

  tunes:
    <<: *tunes-fixture-image
    build:
      context: ./tunes
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:55000
        VITE_REST_API_URL: http://127.0.0.1:55000
        VITE_PUBLIC_ACCESS_TOKEN: fixture-public-token
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://music:music@postgres:5432/music_fixture
      DATABASE_URL_TEST: postgresql://music:music@127.0.0.1:55432/music_fixture
      STRAPI_URL: http://strapi:1337
      STRAPI_ACCESS_TOKEN: fixture-read-only-token
      STRAPI_JWT_SECRET: fixture-strapi-jwt-secret-at-least-32-characters
      STRAPI_FIXTURE_URL: http://127.0.0.1:51337
      ALLOWED_ORIGINS: http://127.0.0.1:55173
      MUSIC_MODE: fixture
      MUSIC_FIXTURE_VERSION: "1"
      SESSION_SECRET: fixture-session-secret-at-least-32-characters
      COOKIE_SECRET: fixture-cookie-secret-at-least-32-characters
      MUSIC_SIGNING_KEY_CURRENT_ID: fixture-current
      MUSIC_SIGNING_KEY_CURRENT_SECRET: fixture-current-secret-at-least-32-characters
      MUSIC_SIGNING_KEY_PREVIOUS_ID: fixture-previous
      MUSIC_SIGNING_KEY_PREVIOUS_SECRET: fixture-previous-secret-at-least-32-characters
      MUSIC_CONNECT_TIMEOUT_MS: "5000"
      MUSIC_READ_TIMEOUT_MS: "10000"
      MUSIC_CIRCUIT_FAILURE_THRESHOLD: "3"
      MUSIC_RATE_LIMIT_PER_MINUTE: "60"
      MUSIC_PROVISIONING_KILL_SWITCH: "true"
      MUSIC_PROVISIONING_COHORT: disabled
      MUSIC_EXPECTED_MIGRATION_ID: 0004_identity_delete_saga
      MUSIC_RECONCILIATION_ENABLED: "false"
      MUSIC_RECONCILIATION_MAX_ROWS: "0"
    ports: ["127.0.0.1:55000:5000"]
    depends_on:
      postgres: { condition: service_healthy }
      strapi: { condition: service_healthy }
      tunes-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/music-fixture/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 20
    labels: *music-labels
    networks: [music-fixture]

  explorers:
    build:
      context: ./explorers-earth
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:55173/graphql
        VITE_REST_API_URL: http://127.0.0.1:55173
        VITE_PUBLIC_ACCESS_TOKEN: fixture-public-token
        VITE_LOCAL_TUNES_URL: http://127.0.0.1:55000
    ports: ["127.0.0.1:55173:80"]
    depends_on:
      tunes: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null && wget -qO- http://127.0.0.1/api/music-fixture/readiness >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
    labels: *music-labels
    networks: [music-fixture]
    volumes: [./explorers-earth/nginx.music-fixture.conf:/etc/nginx/conf.d/default.conf:ro]

networks:
  music-fixture:
    labels: *music-labels

volumes:
  music-fixture-postgres:
    labels: *music-labels
  music-fixture-gates:
    labels: *music-labels
