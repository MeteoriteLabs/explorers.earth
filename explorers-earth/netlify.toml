[[redirects]]
  from = "https://explorers.netlify.app/graphql"
  to = "https://api.explorers.earth/graphql"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.explorers.earth/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[build]
  command = "npm install && npm run build"
  publish = "dist"
