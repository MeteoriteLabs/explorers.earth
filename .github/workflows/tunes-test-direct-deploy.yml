name: Temporary Tunes test-server direct deploy

on:
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Replace only the existing test-server app with automatic application rollback
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TEMPORARY_DIRECT_DEPLOY_EXPIRES: "2026-08-28"

concurrency:
  group: tunes-production-deploy
  cancel-in-progress: false

jobs:
  build-arm64:
    if: github.ref == 'refs/heads/main' && inputs.confirm_test_deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.repository }}@${{ steps.build.outputs.digest }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          [[ "$today" < "$TEMPORARY_DIRECT_DEPLOY_EXPIRES" || "$today" == "$TEMPORARY_DIRECT_DEPLOY_EXPIRES" ]]
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$GITHUB_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/explorers-tunes-test" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build immutable ARM64 candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./tunes
          file: ./tunes/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.commit }}
          build-args: |
            BUILD_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=tunes-test-arm64
          cache-to: type=gha,mode=max,scope=tunes-test-arm64

  deploy-test-server:
    needs: build-arm64
    environment: tunes-production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - name: Back up, migrate, replace app, verify, and automatically roll back on failure
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          CANDIDATE_IMAGE: ${{ needs.build-arm64.outputs.image }}
          CANDIDATE_COMMIT: ${{ needs.build-arm64.outputs.commit }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          fingerprint: ${{ secrets.TUNES_DEPLOY_SSH_FINGERPRINT }}
          command_timeout: 12m
          envs: CANDIDATE_IMAGE,CANDIDATE_COMMIT,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            compose_dir=/home/deploy/tunes/tunes
            compose_file="$compose_dir/docker-compose.yml"
            override_file="$compose_dir/.codex-test-image.override.yml"
            rollout_override_file="$compose_dir/.codex-owner-workspace.override.yml"
            environment_file="$compose_dir/.env"
            authority_dir="$compose_dir/.music-live-authority"
            attestation_dir="$authority_dir/attestations"
            backup_dir="$compose_dir/deployment-backups"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            override_backup="$backup_dir/override-$stamp.yml"
            rollout_override_backup="$backup_dir/owner-workspace-$stamp.yml"
            environment_backup="$backup_dir/environment-$stamp.env"
            rollout_override_present=false
            rollback_image="local/tunes-app-rollback:$stamp"
            success_flag="$backup_dir/deploy-success-$stamp"
            heartbeat_file="$backup_dir/deploy-heartbeat-$stamp"
            watchdog_script="$backup_dir/watchdog-$stamp.sh"
            cd "$compose_dir"
            test -f "$compose_file"
            test -s "$override_file"
            test -s "$environment_file"
            test -d "$authority_dir"
            test -s "$authority_dir/db-migrator"
            test -s "$authority_dir/db-runtime"
            test -s "$authority_dir/gate-key"
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' tunes-app-1)" = tunes
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' tunes-app-1)" = app
            test "$(docker inspect --format '{{.State.Status}}' tunes-db-1)" = running
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            cp "$override_file" "$override_backup"
            chmod 600 "$override_backup"
            if [ -f "$rollout_override_file" ]; then
              cp "$rollout_override_file" "$rollout_override_backup"
              chmod 600 "$rollout_override_backup"
              rollout_override_present=true
            fi
            cp "$environment_file" "$environment_backup"
            chmod 600 "$environment_backup"
            set_environment_value() {
              local key="$1"
              local value="$2"
              local target="$3"
              local temporary="$target.tmp-$stamp"
              awk -v key="$key" -v value="$value" '
                BEGIN { found = 0 }
                index($0, key "=") == 1 {
                  if (!found) { print key "=" value; found = 1 }
                  next
                }
                { print }
                END { if (!found) print key "=" value }
              ' "$target" > "$temporary"
              chmod 600 "$temporary"
              mv "$temporary" "$target"
            }
            old_image_id="$(docker inspect --format '{{.Image}}' tunes-app-1)"
            docker tag "$old_image_id" "$rollback_image"
            db_user="$(docker inspect tunes-db-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_USER=//p' | head -n 1)"
            db_name="$(docker inspect tunes-db-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_DB=//p' | head -n 1)"
            test -n "$db_user"
            test -n "$db_name"
            umask 077
            docker exec tunes-db-1 pg_dumpall -U "$db_user" | gzip -9 > "$backup_dir/postgres-$stamp.sql.gz"
            test -s "$backup_dir/postgres-$stamp.sql.gz"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker pull "$CANDIDATE_IMAGE"
            test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Architecture}}')" = arm64
            test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CANDIDATE_COMMIT"
            current_readiness="$backup_dir/current-readiness-$stamp.json"
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/health/ready > "$current_readiness"
            CURRENT_MIGRATION_MARKER="$(docker run --rm --entrypoint node \
              -v "$current_readiness:/readiness.json:ro" "$CANDIDATE_IMAGE" -e '
                const fs=require("node:fs");
                const value=JSON.parse(fs.readFileSync("/readiness.json","utf8"));
                if(typeof value.migrationMarker!=="string")process.exit(1);
                process.stdout.write(value.migrationMarker);
              ')"
            case "$CURRENT_MIGRATION_MARKER" in
              0017_publication_idempotency_key_retirement|0018_transactional_queue_replacement|0019_queue_visibility_control) ;;
              *) echo 'rollback refused: current app is older than schema compatibility floor' >&2; exit 1 ;;
            esac
            candidate_digest="${CANDIDATE_IMAGE##*@}"
            app_networks="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' tunes-app-1)"
            db_networks="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' tunes-db-1)"
            shared_network_name=""
            for network in $app_networks; do
              if printf '%s\n' "$db_networks" | grep -Fqw "$network"; then shared_network_name="$network"; break; fi
            done
            test -n "$shared_network_name"
            docker run --rm --user "$(id -u):$(id -g)" --network "$shared_network_name" \
              --entrypoint node \
              -e MUSIC_MODE=live -e MUSIC_DATABASE_HOST=db -e MUSIC_DATABASE_PORT=5432 \
              -e MUSIC_DATABASE_NAME="$db_name" -e MUSIC_DATABASE_USER=music_migrator \
              -e MUSIC_DATABASE_PASSWORD_FILE=/run/secrets/db-migrator \
              -e MUSIC_RUNTIME_DATABASE_USER=music_runtime_login \
              -e MUSIC_RUNTIME_DATABASE_PASSWORD_FILE=/run/secrets/db-runtime \
              -e MUSIC_IMAGE_DIGEST="$candidate_digest" -e MUSIC_IMAGE_COMMIT="$CANDIDATE_COMMIT" \
              -e MUSIC_MIGRATION_MARKER=0019_queue_visibility_control \
              -e MUSIC_GATE_ATTESTATION_KEY="$(cat "$authority_dir/gate-key")" \
              -e MUSIC_GATE_ATTESTATION_PATH="/deployment-gates/$candidate_digest.json" \
              -v "$authority_dir/db-migrator:/run/secrets/db-migrator:ro" \
              -v "$authority_dir/db-runtime:/run/secrets/db-runtime:ro" \
              -v "$attestation_dir:/deployment-gates" \
              "$CANDIDATE_IMAGE" dist/server/deployment/run-migration-gate.js
            cat > "$watchdog_script" <<EOF
            #!/usr/bin/env bash
            set -euo pipefail
            for attempt in \$(seq 1 180); do
              test -f "$success_flag" && exit 0
              now=\$(date +%s)
              heartbeat=\$(cat "$heartbeat_file" 2>/dev/null || printf '0')
              if (( now - heartbeat <= 120 )); then sleep 5; continue; fi
              cp "$override_backup" "$override_file"
              chmod 600 "$override_file"
              cp "$environment_backup" "$environment_file"
              chmod 600 "$environment_file"
              if [ "$rollout_override_present" = true ]; then
                cp "$rollout_override_backup" "$rollout_override_file"
                chmod 600 "$rollout_override_file"
              else
                rm -f "$rollout_override_file"
              fi
              for retry in \$(seq 1 3); do
                if [ "$rollout_override_present" = true ]; then
                  docker compose -p tunes -f "$compose_file" -f "$override_file" -f "$rollout_override_file" up -d --no-deps --force-recreate app || true
                else
                  docker compose -p tunes -f "$compose_file" -f "$override_file" up -d --no-deps --force-recreate app || true
                fi
                for check in \$(seq 1 30); do
                  image=\$(docker inspect --format '{{.Image}}' tunes-app-1 2>/dev/null || true)
                  state=\$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)
                  if [ "\$image" = "$old_image_id" ] && [ "\$state" = running ] && curl --fail --silent --max-time 5 http://127.0.0.1:5001/ >/dev/null; then exit 0; fi
                  sleep 2
                done
              done
              touch "$backup_dir/WATCHDOG-ROLLBACK-FAILED-$stamp"
              exit 1
            done
            EOF
            chmod 700 "$watchdog_script"
            date +%s > "$heartbeat_file"
            nohup bash "$watchdog_script" > "$backup_dir/watchdog-$stamp.log" 2>&1 &
            rollback() {
              status=$?
              trap - ERR
              cp "$override_backup" "$override_file"
              cp "$environment_backup" "$environment_file"
              chmod 600 "$environment_file"
              if [ "$rollout_override_present" = true ]; then
                cp "$rollout_override_backup" "$rollout_override_file"
                chmod 600 "$rollout_override_file"
                docker compose -p tunes -f "$compose_file" -f "$override_file" -f "$rollout_override_file" up -d --no-deps --force-recreate app || true
              else
                rm -f "$rollout_override_file"
                docker compose -p tunes -f "$compose_file" -f "$override_file" up -d --no-deps --force-recreate app || true
              fi
              for attempt in $(seq 1 45); do
                image="$(docker inspect --format '{{.Image}}' tunes-app-1 2>/dev/null || true)"
                state="$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)"
                if [ "$image" = "$old_image_id" ] && [ "$state" = running ] && curl --fail --silent --max-time 5 http://127.0.0.1:5001/ >/dev/null; then
                  touch "$success_flag"
                  echo 'Rollback verified.'
                  exit "$status"
                fi
                sleep 2
              done
              echo 'Rollback failed to restore the previous application.'
              exit 1
            }
            trap rollback ERR
            set_environment_value MUSIC_WORKSPACE_KILL_SWITCH false "$environment_file"
            set_environment_value MUSIC_FEATURE_COHORT_SALT explorers-owner-workspace-production-v1 "$environment_file"
            set_environment_value MUSIC_FEATURE_COHORT_VERSION owner-workspace-production-v1 "$environment_file"
            set_environment_value MUSIC_FEATURE_OWNER_WORKSPACE_PERCENT 100 "$environment_file"
            cat > "$rollout_override_file" <<'EOF'
            services:
              app:
                environment:
                  MUSIC_WORKSPACE_KILL_SWITCH: "false"
                  MUSIC_FEATURE_COHORT_SALT: explorers-owner-workspace-production-v1
                  MUSIC_FEATURE_COHORT_VERSION: owner-workspace-production-v1
                  MUSIC_FEATURE_OWNER_WORKSPACE_PERCENT: "100"
            EOF
            chmod 600 "$rollout_override_file"
            sed -E \
              -e "s#^([[:space:]]*image:).*#\\1 $CANDIDATE_IMAGE#" \
              -e "s#^([[:space:]]*MUSIC_IMAGE_DIGEST:).*#\\1 $candidate_digest#" \
              -e "s#^([[:space:]]*MUSIC_IMAGE_COMMIT:).*#\\1 $CANDIDATE_COMMIT#" \
              -e "s#^([[:space:]]*MUSIC_MIGRATION_MARKER:).*#\\1 0019_queue_visibility_control#" \
              -e "s#^([[:space:]]*MUSIC_GATE_ATTESTATION_PATH:).*#\\1 /deployment-gates/$candidate_digest.json#" \
              "$override_backup" > "$override_file"
            chmod 600 "$override_file"
            grep -Fq "image: $CANDIDATE_IMAGE" "$override_file"
            grep -Fq "MUSIC_MIGRATION_MARKER: 0019_queue_visibility_control" "$override_file"
            docker compose -p tunes -f "$compose_file" -f "$override_file" -f "$rollout_override_file" up -d --no-deps --force-recreate app
            readiness="$backup_dir/readiness-$stamp.json"
            for attempt in $(seq 1 60); do
              date +%s > "$heartbeat_file"
              state="$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1 2>/dev/null || true)"
              if [ "$state" = running ] && [ "$health" = healthy ] \
                && curl --fail --silent --max-time 5 http://127.0.0.1:5001/health/live >/dev/null \
                && curl --fail --silent --max-time 5 http://127.0.0.1:5001/health/ready > "$readiness" \
                && curl --fail --silent --max-time 5 http://127.0.0.1:5001/ >/dev/null; then break; fi
              test "$attempt" -lt 60
              sleep 2
            done
            test "$(docker inspect --format '{{.Config.Image}}' tunes-app-1)" = "$CANDIDATE_IMAGE"
            running_environment="$(docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}')"
            printf '%s\n' "$running_environment" | grep -Fxq 'MUSIC_WORKSPACE_KILL_SWITCH=false'
            printf '%s\n' "$running_environment" | grep -Fxq 'MUSIC_FEATURE_COHORT_SALT=explorers-owner-workspace-production-v1'
            printf '%s\n' "$running_environment" | grep -Fxq 'MUSIC_FEATURE_COHORT_VERSION=owner-workspace-production-v1'
            printf '%s\n' "$running_environment" | grep -Fxq 'MUSIC_FEATURE_OWNER_WORKSPACE_PERCENT=100'
            docker run --rm --entrypoint node -v "$readiness:/readiness.json:ro" \
              --env EXPECTED_COMMIT="$CANDIDATE_COMMIT" --env EXPECTED_DIGEST="$candidate_digest" \
              "$CANDIDATE_IMAGE" -e '
                const fs=require("node:fs");
                const value=JSON.parse(fs.readFileSync("/readiness.json","utf8"));
                if(value.ready!==true||value.commit!==process.env.EXPECTED_COMMIT||value.digest!==process.env.EXPECTED_DIGEST||value.migrationMarker!=="0019_queue_visibility_control")process.exit(1);
              '
            touch "$success_flag"
            trap - ERR
            printf 'deployed_commit=%s\n' "$CANDIDATE_COMMIT"
            printf 'deployed_image=%s\n' "$CANDIDATE_IMAGE"
            printf 'database_backup=%s\n' "$backup_dir/postgres-$stamp.sql.gz"
            printf 'rollback_image=%s\n' "$rollback_image"
