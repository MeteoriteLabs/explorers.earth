name: CI Pipeline

on:
  workflow_dispatch:
    inputs:
      run_protected_public_profile:
        description: 'Run the approved dedicated-account public-profile release gate'
        required: true
        type: boolean
        default: false
      public_profile_username:
        description: 'Published dedicated test-account username'
        required: true
        type: string
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: explorers-earth

jobs:
  # ─────────────────────────────────────────
  # Job 1: ESLint Code Quality Check
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────
  # Job 2: TypeScript Type Safety Check
  # ─────────────────────────────────────────
  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        # Use `tsc -b` (not `--noEmit`): the root tsconfig.json is references-only
        # (`files: []`), and in non-build mode tsc ignores project references and
        # checks zero files — a false green. `-b` follows references and matches
        # the compile step in `npm run build`.
        run: npx tsc -b

      - name: Type-check unit tests
        run: npm run typecheck:test

      - name: Type-check Playwright tests
        run: npm run typecheck:e2e

      - name: Check translations
        run: npm run i18n:check

  # ─────────────────────────────────────────
  # Job 3: Unit Tests with Coverage Report
  # ─────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: explorers-earth/coverage/
          retention-days: 14

  public-profile-contract:
    name: 🔐 Public Profile Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic capability and environment contracts
        run: npm run test:public-profile-contract

  public-api-preflight:
    name: 🔐 Protected Public API Preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [public-profile-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-profile-capability
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run live public API capability preflight
        run: npm run verify:public-api -- --username="${{ vars.PUBLIC_PROFILE_CAPABILITY_USERNAME }}" --json > public-api-preflight.json
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}
          VITE_PUBLIC_READ_ACCESS_TOKEN: ${{ secrets.VITE_PUBLIC_READ_ACCESS_TOKEN }}
          VITE_ANALYTICS_WRITE_ACCESS_TOKEN: ${{ secrets.VITE_ANALYTICS_WRITE_ACCESS_TOKEN }}
          PUBLIC_API_CAPABILITY_SCOPE: ${{ vars.PUBLIC_API_CAPABILITY_SCOPE }}
          PUBLIC_API_EXPECTED_ORIGIN: ${{ vars.PUBLIC_API_EXPECTED_ORIGIN }}
          PUBLIC_API_ORIGIN_POLICY: ${{ vars.PUBLIC_API_ORIGIN_POLICY }}
          PUBLIC_API_RATE_LIMIT_POLICY: ${{ vars.PUBLIC_API_RATE_LIMIT_POLICY }}
          PUBLIC_API_CONTROLLED_FIXTURE: 'true'
          PUBLIC_API_PRIVATE_ACCOUNT_ID: ${{ vars.PUBLIC_API_PRIVATE_ACCOUNT_ID }}
          PUBLIC_API_PRIVATE_LIST_ID: ${{ vars.PUBLIC_API_PRIVATE_LIST_ID }}
          PUBLIC_API_PRIVATE_ITEM_ID: ${{ vars.PUBLIC_API_PRIVATE_ITEM_ID }}
          PUBLIC_API_PRIVATE_LIST_SLUG: ${{ vars.PUBLIC_API_PRIVATE_LIST_SLUG }}
          PUBLIC_API_RUN_ID: qa-ci-${{ github.run_id }}-${{ github.run_attempt }}
          PUBLIC_PROFILE_MUTATION_APPROVED: ${{ vars.PUBLIC_PROFILE_MUTATION_APPROVED }}
          PUBLIC_PROFILE_TEST_ACCOUNT_MARKER: ${{ vars.PUBLIC_PROFILE_TEST_ACCOUNT_MARKER }}
          PUBLIC_API_ANALYTICS_QA_SINK: ${{ vars.PUBLIC_API_ANALYTICS_QA_SINK }}
          PUBLIC_API_ANALYTICS_CANARY_MUTATION: ${{ vars.PUBLIC_API_ANALYTICS_CANARY_MUTATION }}
          PUBLIC_API_ANALYTICS_CLEANUP_MUTATION: ${{ vars.PUBLIC_API_ANALYTICS_CLEANUP_MUTATION }}
          PUBLIC_API_ANALYTICS_CLEANUP_VERIFY_QUERY: ${{ vars.PUBLIC_API_ANALYTICS_CLEANUP_VERIFY_QUERY }}
          PUBLIC_API_ANALYTICS_RUN_CLEANUP_MUTATION: ${{ vars.PUBLIC_API_ANALYTICS_RUN_CLEANUP_MUTATION }}
          PUBLIC_API_ANALYTICS_RUN_CLEANUP_VERIFY_QUERY: ${{ vars.PUBLIC_API_ANALYTICS_RUN_CLEANUP_VERIFY_QUERY }}

      - name: Archive redacted capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-preflight
          path: explorers-earth/public-api-preflight.json
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────
  # Job 3b: Production Build (parity with deploy)
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────
  # Job 4: Integration Tests
  # ─────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx vitest run --reporter=verbose integration
        env:
          CI: true

  # ─────────────────────────────────────────
  # Job 5: Playwright E2E Tests (headless)
  # ─────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run deterministic Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
          VITE_GOOGLE_MAPS_API_KEY: test-key
          VITE_PUBLIC_ACCESS_TOKEN: test-token
          # Music flow (music.spec.ts) mocks the Local Tunes API and needs the
          # integration enabled or the playlist UI never renders.
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: http://localhost:5173

      - name: Require deterministic HTML report
        if: always()
        run: test -f playwright-report/deterministic/index.html

      - name: Require deterministic JSON summary
        if: always()
        run: test -f test-results/playwright/deterministic/summary.json

      - name: Require deterministic JUnit summary
        if: always()
        run: test -f test-results/playwright/deterministic/junit.xml

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: explorers-earth/playwright-report/deterministic/
          if-no-files-found: error
          retention-days: 7

      - name: Upload machine-readable Playwright summaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-playwright-summaries
          path: |
            explorers-earth/test-results/playwright/deterministic/summary.json
            explorers-earth/test-results/playwright/deterministic/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: explorers-earth/test-results/playwright/deterministic/failure-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload public profile contact-sheet artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-profile-contact-sheet
          path: explorers-earth/test-results/contact-sheet/
          if-no-files-found: warn
          retention-days: 14

  protected-public-profile-release:
    name: 🔒 Protected Public Profile Release
    if: github.event_name == 'workflow_dispatch' && inputs.run_protected_public_profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: public-profile-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Materialize protected browser fixtures
        run: node scripts/materialize-protected-fixtures.mjs
        env:
          PROTECTED_OWNER_STORAGE_STATE_JSON: ${{ secrets.E2E_PROFILE_OWNER_STORAGE_STATE_JSON }}
          PROTECTED_NON_OWNER_STORAGE_STATE_JSON: ${{ secrets.E2E_PROFILE_NON_OWNER_STORAGE_STATE_JSON }}
          PROTECTED_GALLERY_BASE64: ${{ secrets.E2E_PROFILE_GALLERY_BASE64 }}

      - name: Run approved protected release verification
        run: npm run verify:public-profile:release -- --username="${{ inputs.public_profile_username }}" --json
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}
          VITE_PUBLIC_READ_ACCESS_TOKEN: ${{ secrets.VITE_PUBLIC_READ_ACCESS_TOKEN }}
          VITE_ANALYTICS_WRITE_ACCESS_TOKEN: ${{ secrets.VITE_ANALYTICS_WRITE_ACCESS_TOKEN }}
          PUBLIC_API_CAPABILITY_SCOPE: ${{ vars.PUBLIC_API_CAPABILITY_SCOPE }}
          PUBLIC_API_EXPECTED_ORIGIN: ${{ vars.PUBLIC_API_EXPECTED_ORIGIN }}
          PUBLIC_API_ORIGIN_POLICY: ${{ vars.PUBLIC_API_ORIGIN_POLICY }}
          PUBLIC_API_RATE_LIMIT_POLICY: ${{ vars.PUBLIC_API_RATE_LIMIT_POLICY }}
          PUBLIC_API_CONTROLLED_FIXTURE: 'true'
          PUBLIC_API_PRIVATE_ACCOUNT_ID: ${{ vars.PUBLIC_API_PRIVATE_ACCOUNT_ID }}
          PUBLIC_API_PRIVATE_LIST_ID: ${{ vars.PUBLIC_API_PRIVATE_LIST_ID }}
          PUBLIC_API_PRIVATE_ITEM_ID: ${{ vars.PUBLIC_API_PRIVATE_ITEM_ID }}
          PUBLIC_API_PRIVATE_LIST_SLUG: ${{ vars.PUBLIC_API_PRIVATE_LIST_SLUG }}
          PUBLIC_API_RUN_ID: qa-ci-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_PROFILE_RUN_ID: qa-ci-${{ github.run_id }}-${{ github.run_attempt }}
          PUBLIC_PROFILE_MUTATION_APPROVED: ${{ vars.PUBLIC_PROFILE_MUTATION_APPROVED }}
          PUBLIC_PROFILE_TEST_ACCOUNT_MARKER: ${{ vars.PUBLIC_PROFILE_TEST_ACCOUNT_MARKER }}
          PUBLIC_API_ANALYTICS_QA_SINK: ${{ vars.PUBLIC_API_ANALYTICS_QA_SINK }}
          PUBLIC_API_ANALYTICS_CANARY_MUTATION: ${{ vars.PUBLIC_API_ANALYTICS_CANARY_MUTATION }}
          PUBLIC_API_ANALYTICS_CLEANUP_MUTATION: ${{ vars.PUBLIC_API_ANALYTICS_CLEANUP_MUTATION }}
          PUBLIC_API_ANALYTICS_CLEANUP_VERIFY_QUERY: ${{ vars.PUBLIC_API_ANALYTICS_CLEANUP_VERIFY_QUERY }}
          PUBLIC_API_ANALYTICS_RUN_CLEANUP_MUTATION: ${{ vars.PUBLIC_API_ANALYTICS_RUN_CLEANUP_MUTATION }}
          PUBLIC_API_ANALYTICS_RUN_CLEANUP_VERIFY_QUERY: ${{ vars.PUBLIC_API_ANALYTICS_RUN_CLEANUP_VERIFY_QUERY }}
          E2E_PROFILE_USERNAME: ${{ inputs.public_profile_username }}
          E2E_PROFILE_ROUTE_FIXTURES: ${{ secrets.E2E_PROFILE_ROUTE_FIXTURES }}
          E2E_PROFILE_LIVE_WRITES: '1'
          E2E_PROFILE_LIVE_WRITE_CONFIRMATION: I_APPROVE_PROFILE_MUTATION_AND_RESTORE

      - name: Remove protected browser fixtures
        if: always()
        run: |
          if [ -n "${E2E_PROFILE_FIXTURE_DIR:-}" ]; then
            node scripts/materialize-protected-fixtures.mjs --cleanup="${E2E_PROFILE_FIXTURE_DIR}"
          fi

      - name: Require protected orchestration summary
        if: always()
        run: test -f test-results/public-profile-verification/verification-summary.json

      - name: Require protected Playwright summary
        if: always()
        run: test -f test-results/playwright/real-account-redacted/summary.json

      - name: Upload required redacted protected summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-public-profile-summary
          path: explorers-earth/test-results/public-profile-verification/verification-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload required protected Playwright summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-playwright-summary
          path: explorers-earth/test-results/playwright/real-account-redacted/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload optional protected failure media
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: protected-public-profile-failure-artifacts
          path: explorers-earth/test-results/playwright/real-account-redacted/failure-artifacts/
          if-no-files-found: warn
          retention-days: 7

