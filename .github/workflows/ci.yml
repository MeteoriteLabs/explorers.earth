name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: explorers-earth

jobs:
  # ─────────────────────────────────────────
  # Job 1: ESLint Code Quality Check
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────
  # Job 2: TypeScript Type Safety Check
  # ─────────────────────────────────────────
  typecheck:
    name: 🔷 TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        # Use `tsc -b` (not `--noEmit`): the root tsconfig.json is references-only
        # (`files: []`), and in non-build mode tsc ignores project references and
        # checks zero files — a false green. `-b` follows references and matches
        # the compile step in `npm run build`.
        run: npx tsc -b

  # ─────────────────────────────────────────
  # Job 3: Unit Tests with Coverage Report
  # ─────────────────────────────────────────
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: explorers-earth/coverage/
          retention-days: 14

  # ─────────────────────────────────────────
  # Job 3b: Production Build (parity with deploy)
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────
  # Job 4: Integration Tests
  # ─────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --reporter=verbose
        env:
          CI: true

  # ─────────────────────────────────────────
  # Job 5: Playwright E2E Tests (headless)
  # ─────────────────────────────────────────
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: explorers-earth/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The public Music E2E fixture executes the sibling Tunes controller.
      # Install that package explicitly; CI package installs are isolated.
      - name: Install Music fixture dependencies
        run: npm ci --prefix ../tunes --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E tests
        # Keep the required PR gate bounded and deterministic. The default
        # Chromium project matches every repository E2E spec (including large
        # qualification matrices), so invoking it without an allowlist cannot
        # complete inside this job's 30-minute budget. These suites cover the
        # changed public shell/navigation, publishing, Music, accessibility,
        # and account-lifecycle boundaries; exhaustive matrices retain their
        # dedicated fixture/qualification lanes documented in docs/testing.md.
        run: |
          npx playwright test --config=playwright.category-navigation.config.ts
          npx playwright test --config=playwright.public-shell-continuity.config.ts --project=chromium
          npx playwright test --config=playwright.music-publishing.config.ts
          npx playwright test e2e/music.spec.ts e2e/music-accessibility.spec.ts e2e/account-lifecycle.spec.ts --project=chromium-pr-safe --project=firefox-music-visual --project=webkit-music-visual
        env:
          CI: true
          # Apollo uses VITE_API_URL verbatim as the GraphQL URI (src/main.tsx);
          # it must end in /graphql for the specs' **/graphql route mocks to match.
          VITE_API_URL: http://localhost:5173/graphql
          # Empty by design: the contained public-page fixture uses its map
          # adapter and must never load the external Google Maps runtime.
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_PUBLIC_ACCESS_TOKEN: test-token
          # Music flow (music.spec.ts) mocks the Local Tunes API and needs the
          # integration enabled or the playlist UI never renders.
          VITE_LOCAL_TUNES_ENABLED: true
          VITE_LOCAL_TUNES_API_URL: https://localtunes.test
          # Keep the public profile gateway inside the same deterministic
          # request fixture instead of falling back to an external authority.
          VITE_PUBLIC_PROFILE_GATEWAY_URL: https://localtunes.test
          # Full-stack Music authority suites belong to the provisioned qualification lanes.
          PLAYWRIGHT_PR_SAFE: true
          # Keep billing requests same-origin so the deterministic Playwright
          # fixture can intercept them instead of constructing /undefined URLs.
          VITE_PAYMENT_API_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            explorers-earth/playwright-report/
            .artifacts/category-navigation/report.json
            .artifacts/public-shell-continuity/report.json
            .artifacts/music-publishing/report.json
          retention-days: 7

      - name: Upload screenshots/videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            explorers-earth/test-results/
            .artifacts/category-navigation/results/
            .artifacts/public-shell-continuity/results/
            .artifacts/music-publishing/results/
          retention-days: 7
