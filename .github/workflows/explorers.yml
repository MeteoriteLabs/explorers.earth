name: Deploy Explorers Frontend

on:
  push:
    branches: [main]
    paths:
      - "explorers-earth/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        working-directory: explorers-earth
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "VITE_REST_API_URL=${{ secrets.VITE_REST_API_URL }}" >> .env
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "VITE_PUBLIC_ACCESS_TOKEN=${{ secrets.VITE_PUBLIC_ACCESS_TOKEN }}" >> .env
          echo "VITE_PUBLIC_SHAREABLE_LINK=${{ secrets.VITE_PUBLIC_SHAREABLE_LINK }}" >> .env
          echo "VITE_GOOGLE_CUSTOM_SEARCH_API_KEY=${{ secrets.VITE_GOOGLE_CUSTOM_SEARCH_API_KEY }}" >> .env
          echo "VITE_GOOGLE_CUSTOM_SEARCH_ENGINE_ID=${{ secrets.VITE_GOOGLE_CUSTOM_SEARCH_ENGINE_ID }}" >> .env
          echo "VITE_LOCAL_TUNES_API_URL=${{ secrets.VITE_LOCAL_TUNES_API_URL }}" >> .env
          echo "VITE_LOCAL_TUNES_ENABLED=${{ secrets.VITE_LOCAL_TUNES_ENABLED }}" >> .env
          echo "VITE_LOCAL_TUNES_TIMEOUT=${{ secrets.VITE_LOCAL_TUNES_TIMEOUT }}" >> .env
          echo "VITE_LOCAL_TUNES_RETRY_ATTEMPTS=${{ secrets.VITE_LOCAL_TUNES_RETRY_ATTEMPTS }}" >> .env
          echo "VITE_RAZORPAY_KEY_ID_DEV=${{ secrets.VITE_RAZORPAY_KEY_ID_DEV }}" >> .env
          echo "VITE_PAYMENT_API_URL=${{ secrets.VITE_PAYMENT_API_URL }}" >> .env
          echo "VITE_RAZORPAY_KEY_ID_PROD=${{ secrets.VITE_RAZORPAY_KEY_ID_PROD }}" >> .env
          echo "VITE_INSTAGRAM_API_URL=${{ secrets.VITE_INSTAGRAM_API_URL }}" >> .env

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: explorers-earth
        run: npm i

      - name: Build
        working-directory: explorers-earth
        run: npm run build

      - name: Clean server directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EXPLORERS_DEPLOY_HOST }}
          username: ${{ secrets.EXPLORERS_DEPLOY_USER }}
          key: ${{ secrets.EXPLORERS_DEPLOY_KEY }}
          script: |
            rm -rf /home/deployuser/explorers-frontend/*
            mkdir -p /home/deployuser/explorers-frontend

      - name: Upload build
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EXPLORERS_DEPLOY_HOST }}
          username: ${{ secrets.EXPLORERS_DEPLOY_USER }}
          key: ${{ secrets.EXPLORERS_DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "explorers-earth/dist/"
          target: "/home/deployuser/explorers-frontend"

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EXPLORERS_DEPLOY_HOST }}
          username: ${{ secrets.EXPLORERS_DEPLOY_USER }}
          key: ${{ secrets.EXPLORERS_DEPLOY_KEY }}
          script: |
            sudo systemctl reload nginx
