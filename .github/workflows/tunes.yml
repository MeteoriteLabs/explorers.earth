name: Tunes immutable image CI

on:
  pull_request:
    paths:
      - tunes/**
      - .env.music.example
      - .env.music.test.example
      - docker-compose.yml
      - docker-compose.music-test.yml
      - .github/workflows/tunes.yml
      - .github/workflows/tunes-deploy.yml
      - .github/workflows/music-reconcile.yml
  push:
    branches: [main]
    paths:
      - tunes/**
      - .env.music.example
      - .env.music.test.example
      - docker-compose.yml
      - docker-compose.music-test.yml
      - .github/workflows/tunes.yml
      - .github/workflows/tunes-deploy.yml
      - .github/workflows/music-reconcile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan-push:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: music_fixture
          POSTGRES_USER: music_migrator
          POSTGRES_PASSWORD: music
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U music_migrator -d music_fixture"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      digest: ${{ steps.push.outputs.digest }}
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Prove C1 containment ancestry
        shell: bash
        run: git merge-base --is-ancestor d226f7e4dc5a54195a59804ec729f72b5e8f10d7 "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: tunes/package-lock.json
      - name: Test Tunes
        working-directory: tunes
        env:
          MUSIC_C3_POSTGRES_TEST: "1"
          MUSIC_C8_POSTGRES_TEST: "1"
          MUSIC_C9_PUBLICATION_POSTGRES_TEST: "1"
          DATABASE_URL_TEST: postgresql://music_migrator:music@127.0.0.1:55432/music_fixture
        run: |
          npm ci --legacy-peer-deps
          npm test -- --maxWorkers=2
          npm run test:integration
          npm run test:music-c8:coverage
          npm run test:music-c8:repository-coverage
          npm run music:types:scoped
          npm run music:types:baseline
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve immutable image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/explorers-tunes" >> "$GITHUB_OUTPUT"
      - name: Build Tunes exactly once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./tunes
          file: ./tunes/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=explorers-tunes
          cache-to: type=gha,mode=max,scope=explorers-tunes
      - name: Prove gate entrypoint is in the exact image
        shell: bash
        run: >-
          docker run --rm --entrypoint node
          "${{ steps.image.outputs.name }}:${{ github.sha }}" -e
          "const{existsSync}=require('node:fs');for(const p of ['/app/dist/server/deployment/run-migration-gate.js','/app/dist/server/deployment/run-registration-compat.js','/app/migrations/0001_runtime_baseline.sql','/app/migrations/0002_identity_lifecycle.sql','/app/migrations/0003_identity_lifecycle_hardening.sql','/app/migrations/0004_identity_delete_saga.sql','/app/migrations/0005_resource_bound_deletion_history.sql','/app/migrations/0006_numeric_identity_lock.sql','/app/migrations/0007_identity_provider_snapshot.sql','/app/migrations/0008_credential_revocation_operations.sql','/app/migrations/0009_credential_revocation_history_immutability.sql','/app/migrations/0010_least_privilege_runtime_role.sql','/app/migrations/0011_durable_publication_idempotency.sql','/app/migrations/0012_publication_replay_expiry_guard.sql','/app/migrations/0013_publication_operation_database_clock.sql','/app/migrations/0014_durable_reactivation_authority.sql','/app/migrations/0015_publication_operation_archive.sql','/app/migrations/0016_publication_operation_retention.sql','/app/migrations/0017_publication_idempotency_key_retirement.sql','/app/migrations/0018_transactional_queue_replacement.sql'])if(!existsSync(p))process.exit(1)"
      - name: Prove the exact production image loads its server graph
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s docker run --rm --entrypoint node \
            "${{ steps.image.outputs.name }}:${{ github.sha }}" \
            dist/server/deployment/run-production-graph-smoke.js
      - name: Block fixable high and critical image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - name: Report all high and critical image vulnerabilities
        if: always()
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          only-fixed: false
          output-format: sarif
          output-file: grype-complete.sarif
      - name: Retain complete vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-complete-${{ github.sha }}
          path: grype-complete.sarif
          if-no-files-found: error
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and expose registry digest
        if: github.event_name != 'pull_request'
        id: push
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          image_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${GITHUB_SHA}")"
          digest="${image_ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest the pushed image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-test-scan-push
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/tunes-deploy.yml
    with:
      digest: ${{ needs.build-test-scan-push.outputs.digest }}
      commit: ${{ needs.build-test-scan-push.outputs.commit }}
    secrets:
      TUNES_DEPLOY_HOST: ${{ secrets.TUNES_DEPLOY_HOST }}
      TUNES_DEPLOY_KEY: ${{ secrets.TUNES_DEPLOY_KEY }}
