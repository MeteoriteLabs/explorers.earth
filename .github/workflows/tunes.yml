name: Tunes immutable image CI

on:
  pull_request:
    paths:
      - tunes/**
      - docker-compose.yml
      - docker-compose.music-test.yml
      - .github/workflows/tunes.yml
      - .github/workflows/tunes-deploy.yml
  push:
    branches: [main]
    paths:
      - tunes/**
      - docker-compose.yml
      - docker-compose.music-test.yml
      - .github/workflows/tunes.yml
      - .github/workflows/tunes-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan-push:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: music_fixture
          POSTGRES_USER: music
          POSTGRES_PASSWORD: music
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U music -d music_fixture"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
      digest: ${{ steps.push.outputs.digest }}
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove C1 containment ancestry
        shell: bash
        run: git merge-base --is-ancestor d226f7e4dc5a54195a59804ec729f72b5e8f10d7 "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: tunes/package-lock.json
      - name: Test Tunes
        working-directory: tunes
        env:
          MUSIC_C3_POSTGRES_TEST: "1"
          DATABASE_URL_TEST: postgresql://music:music@127.0.0.1:55432/music_fixture
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run test:integration
          npm run music:types:scoped
          npm run music:types:baseline
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/explorers-tunes" >> "$GITHUB_OUTPUT"
      - name: Build Tunes exactly once
        uses: docker/build-push-action@v6
        with:
          context: ./tunes
          file: ./tunes/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=explorers-tunes
          cache-to: type=gha,mode=max,scope=explorers-tunes
      - name: Prove gate entrypoint is in the exact image
        shell: bash
        run: >-
          docker run --rm --entrypoint node
          "${{ steps.image.outputs.name }}:${{ github.sha }}" -e
          "const{existsSync}=require('node:fs');for(const p of ['/app/dist/server/deployment/run-migration-gate.js','/app/dist/server/deployment/run-registration-compat.js','/app/migrations/0001_runtime_baseline.sql','/app/migrations/0002_identity_lifecycle.sql','/app/migrations/0003_identity_lifecycle_hardening.sql','/app/migrations/0004_identity_delete_saga.sql'])if(!existsSync(p))process.exit(1)"
      - name: Scan the exact built image
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and expose registry digest
        if: github.event_name != 'pull_request'
        id: push
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          image_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_NAME}:${GITHUB_SHA}")"
          digest="${image_ref##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest the pushed image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-test-scan-push
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/tunes-deploy.yml
    with:
      digest: ${{ needs.build-test-scan-push.outputs.digest }}
      commit: ${{ needs.build-test-scan-push.outputs.commit }}
    secrets: inherit
