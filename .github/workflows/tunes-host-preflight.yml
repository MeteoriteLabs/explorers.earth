name: One-shot Tunes test server direct deploy
on:
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Replace only the existing test-server app service with automatic rollback
        required: true
        default: false
        type: boolean
      diagnose_last_attempt:
        description: Read the sanitized readiness result and current rollback state only
        required: true
        default: false
        type: boolean
      run_authenticated_identity_slo:
        description: Run the authenticated identity SLO probe with one controlled test-app restart
        required: true
        default: false
        type: boolean
      expected_deployed_commit:
        description: Exact 40-character commit currently deployed to the Tunes test app
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tunes-test-server-one-shot
  cancel-in-progress: false

jobs:
  authenticated-identity-slo:
    if: github.ref == 'refs/heads/codex/tunes-fingerprint-diagnostic' && inputs.run_authenticated_identity_slo && !inputs.confirm_test_deploy && !inputs.diagnose_last_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      EXPECTED_DEPLOYED_COMMIT: ${{ inputs.expected_deployed_commit }}
      MUSIC_SLO_STRAPI_USER_TOKEN: ${{ secrets.MUSIC_SLO_STRAPI_USER_TOKEN }}
    steps:
      - name: Probe authenticated identity SLO without identity output
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          fingerprint: SHA256:mkzoRIglhalq6lNwNgM2kyuRLFGLeIbpLQpypShYMSw
          command_timeout: 30m
          envs: EXPECTED_DEPLOYED_COMMIT,MUSIC_SLO_STRAPI_USER_TOKEN
          script: |
            set -euo pipefail
            failure_stage=target_attestation
            report_shell_failure() {
              local status=$?
              trap - EXIT
              unset MUSIC_SLO_STRAPI_USER_TOKEN
              if [ "$status" -ne 0 ]; then
                printf '{"schemaVersion":"music-identity-slo-stage/v1","outcome":"failed_closed","stage":"%s"}\n' "$failure_stage"
              fi
              exit "$status"
            }
            trap report_shell_failure EXIT
            select_published_readiness_binding() {
              local count=0
              local selected_port=
              local has_ipv4=false
              local host_ip host_port extra
              while IFS='|' read -r host_ip host_port extra; do
                test -n "$host_ip" || return 1
                test -n "$host_port" || return 1
                test -z "$extra" || return 1
                count=$((count + 1))
                test "$count" -le 2 || return 1
                case "$host_ip" in
                  127.0.0.1|0.0.0.0) has_ipv4=true ;;
                  ::1|::) ;;
                  *) return 1 ;;
                esac
                [[ "$host_port" =~ ^[0-9]{1,5}$ ]] || return 1
                test "$host_port" -ge 1 || return 1
                test "$host_port" -le 65535 || return 1
                if [ -z "$selected_port" ]; then
                  selected_port="$host_port"
                else
                  test "$selected_port" = "$host_port" || return 1
                fi
              done
              test "$count" -ge 1 || return 1
              if [ "$has_ipv4" = true ]; then
                printf '127.0.0.1|%s\n' "$selected_port"
              else
                printf '[::1]|%s\n' "$selected_port"
              fi
            }
            [[ "$EXPECTED_DEPLOYED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' tunes-app-1)" = tunes
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' tunes-app-1)" = app
            test "$(docker inspect --format '{{.State.Status}}' tunes-app-1)" = running
            test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1)" = healthy
            configured_image="$(docker inspect --format '{{.Config.Image}}' tunes-app-1)"
            [[ "$configured_image" =~ ^ghcr\.io/[a-z0-9._-]+/explorers-tunes-test@sha256:[a-f0-9]{64}$ ]]
            container_commit="$(docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MUSIC_IMAGE_COMMIT=//p')"
            container_digest="$(docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MUSIC_IMAGE_DIGEST=//p')"
            image_revision="$(docker image inspect "$configured_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$container_commit" = "$EXPECTED_DEPLOYED_COMMIT"
            test "$image_revision" = "$EXPECTED_DEPLOYED_COMMIT"
            test "$container_digest" = "${configured_image##*@}"
            failure_stage=published_binding_attestation
            published_binding_rows="$(docker inspect --format '{{range (index .NetworkSettings.Ports "5000/tcp")}}{{printf "%s|%s\n" .HostIp .HostPort}}{{end}}' tunes-app-1)"
            published_binding_selection="$(select_published_readiness_binding <<< "$published_binding_rows")"
            published_probe_host="${published_binding_selection%%|*}"
            published_host_port="${published_binding_selection##*|}"
            published_ready_url="http://${published_probe_host}:${published_host_port}/health/ready"
            container_cache_ttl_ms="$(docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MUSIC_IDENTITY_CACHE_TTL_MS=//p')"
            container_identity_rate_limit="$(docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MUSIC_RATE_LIMIT_PER_MINUTE=//p')"
            test "$container_cache_ttl_ms" = 30000
            test "$container_identity_rate_limit" = 30
            failure_stage=probe_authority_attestation
            [[ "${MUSIC_SLO_STRAPI_USER_TOKEN:-}" =~ ^[A-Za-z0-9._~-]{16,4096}$ ]]
            docker exec -e MUSIC_SLO_PREFLIGHT=1 -e MUSIC_SLO_STRAPI_USER_TOKEN -i tunes-app-1 node <<'PREFLIGHT'
            const { readFileSync } = require("node:fs");
            const { Pool } = require("pg");

            const record = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            const exactKeys = (value, keys) => record(value)
              && Object.keys(value).sort().join("|") === [...keys].sort().join("|");
            const jwtPattern = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/;
            const maximumFullJobDurationMs = 35 * 60 * 1_000;
            const bearerLifetimeSafetyMarginMs = 5 * 60 * 1_000;

            function assertBearerLifetime(proof, nowMs) {
              try {
                const segments = proof.split(".");
                if (segments.length !== 3 || !Number.isSafeInteger(nowMs)) throw new Error();
                const claims = JSON.parse(Buffer.from(segments[1], "base64url").toString("utf8"));
                if (!record(claims) || !Number.isSafeInteger(claims.exp)
                    || claims.exp > Math.floor(Number.MAX_SAFE_INTEGER / 1_000)
                    || claims.exp * 1_000 - nowMs <= maximumFullJobDurationMs + bearerLifetimeSafetyMarginMs) {
                  throw new Error();
                }
              } catch {
                throw new Error("bearer lifetime insufficient");
              }
            }

            function validateEnsurePayload(text, nowMs) {
              let value;
              try { value = JSON.parse(text); }
              catch { throw new Error("bearer preflight failed"); }
              if (!exactKeys(value, ["version", "identity", "credential"])
                  || value.version !== "music-identity/v1"
                  || !exactKeys(value.identity, ["musicUserId", "status"])
                  || !Number.isSafeInteger(value.identity.musicUserId) || value.identity.musicUserId < 1
                  || value.identity.status !== "active"
                  || !exactKeys(value.credential, ["token", "expiresAt"])
                  || typeof value.credential.token !== "string"
                  || value.credential.token.length < 64 || value.credential.token.length > 4_096
                  || !jwtPattern.test(value.credential.token)
                  || !Number.isSafeInteger(value.credential.expiresAt)
                  || value.credential.expiresAt <= nowMs) {
                throw new Error("bearer preflight failed");
              }
              return value;
            }

            async function within(operation, timeoutMs, controller) {
              let timer;
              try {
                return await Promise.race([
                  operation,
                  new Promise((_, reject) => {
                    timer = setTimeout(() => {
                      controller.abort();
                      reject(new Error("bearer preflight failed"));
                    }, timeoutMs);
                  }),
                ]);
              } finally {
                if (timer) clearTimeout(timer);
              }
            }

            async function validateProvisionedBearer({
              proof,
              expectedMusicUserId,
              fetchImpl = fetch,
              wallNow = () => Date.now(),
              timeoutMs = 6_000,
            }) {
              const controller = new AbortController();
              let response;
              try {
                const nowMs = wallNow();
                assertBearerLifetime(proof, nowMs);
                response = await within(fetchImpl(new URL("/api/music/identity/ensure", "http://127.0.0.1:5000"), {
                  method: "POST",
                  headers: { authorization: `Bearer ${proof}` },
                  redirect: "error",
                  signal: controller.signal,
                }), timeoutMs, controller);
                if (response.status !== 200) throw new Error("bearer preflight failed");
                const text = await within(Promise.resolve(response.text()), timeoutMs, controller);
                const value = validateEnsurePayload(text, nowMs);
                if (value.identity.musicUserId !== expectedMusicUserId) throw new Error("bearer preflight failed");
              } catch {
                try {
                  if (response?.body && !response.body.locked) {
                    void Promise.resolve(response.body.cancel()).catch(() => undefined);
                  }
                } catch {}
                throw new Error("bearer preflight failed");
              }
            }

            function databaseConfiguration() {
              if (process.env.DATABASE_URL) return { connectionString: process.env.DATABASE_URL };
              const passwordFile = process.env.MUSIC_DATABASE_PASSWORD_FILE;
              const port = Number(process.env.MUSIC_DATABASE_PORT);
              if (!process.env.MUSIC_DATABASE_HOST || !process.env.MUSIC_DATABASE_NAME
                  || !process.env.MUSIC_DATABASE_USER || !passwordFile
                  || !Number.isSafeInteger(port) || port < 1 || port > 65_535) {
                throw new Error("bearer preflight failed");
              }
              return {
                host: process.env.MUSIC_DATABASE_HOST,
                port,
                database: process.env.MUSIC_DATABASE_NAME,
                user: process.env.MUSIC_DATABASE_USER,
                password: readFileSync(passwordFile, "utf8").trim(),
              };
            }

            async function selectProvisionedMusicUserId() {
              const pool = new Pool({ ...databaseConfiguration(), max: 1, connectionTimeoutMillis: 5_000 });
              try {
                const result = await pool.query(`SELECT id FROM users WHERE identity_status='active' ORDER BY id ASC LIMIT 1`);
                if (result.rows.length !== 1 || !Number.isSafeInteger(result.rows[0].id) || result.rows[0].id < 1) {
                  throw new Error("bearer preflight failed");
                }
                return result.rows[0].id;
              } finally {
                await pool.end();
              }
            }

            async function main() {
              const proof = process.env.MUSIC_SLO_STRAPI_USER_TOKEN;
              delete process.env.MUSIC_SLO_STRAPI_USER_TOKEN;
              if (typeof proof !== "string" || !/^[A-Za-z0-9._~-]{16,4096}$/.test(proof)) {
                throw new Error("bearer preflight failed");
              }
              const expectedMusicUserId = await selectProvisionedMusicUserId();
              await validateProvisionedBearer({ proof, expectedMusicUserId });
            }

            module.exports = { assertBearerLifetime, validateProvisionedBearer };
            if (process.env.MUSIC_SLO_PREFLIGHT === "1") {
              main().catch(() => { process.exitCode = 1; });
            }
            PREFLIGHT
            failure_stage=restart
            docker restart --time 30 tunes-app-1 >/dev/null
            failure_stage=restart_readiness
            ready=false
            readiness_deadline=$((SECONDS + 60))
            while [ "$SECONDS" -lt "$readiness_deadline" ]; do
              state="$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1 2>/dev/null || true)"
              if [ "$state" = running ] && [ "$health" = healthy ] \
                  && curl --fail --silent --show-error --max-time 2 "$published_ready_url" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
            trap - EXIT
            sampling_status=0
            docker exec -e MUSIC_SLO_EXECUTE=1 -e MUSIC_SLO_STRAPI_USER_TOKEN -i tunes-app-1 node <<'NODE' || sampling_status=$?
            const { performance } = require("node:perf_hooks");

            const schemaVersion = "music-identity-slo/v1";
            const coldMode = "gateway_proof_cache_ttl_cold";
            const ensureMutation = "identity_snapshots_and_sync_timestamps";
            const batchPlans = Array.from({ length: 20 }, (_, index) => ({
              warm: index < 10 ? 5 : 4,
              concurrent: index < 10 ? 4 : 5,
            }));
            let finished = false;
            const finish = (value, passed) => {
              if (finished) return;
              finished = true;
              console.log(JSON.stringify(value));
              if (!passed) process.exitCode = 1;
            };

            const percentile95 = (values) => {
              const sorted = [...values].sort((left, right) => left - right);
              return sorted[Math.max(0, Math.ceil(sorted.length * 0.95) - 1)];
            };
            const milliseconds = (value) => Math.round(value * 10) / 10;
            const sleep = (delayMs) => new Promise((resolve) => setTimeout(resolve, delayMs));
            const record = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
            const exactKeys = (value, keys) => record(value)
              && Object.keys(value).sort().join("|") === [...keys].sort().join("|");
            const jwtPattern = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/;

            function validateEnsurePayload(text, nowMs) {
              let value;
              try { value = JSON.parse(text); }
              catch { throw new Error("credential response malformed"); }
              if (!exactKeys(value, ["version", "identity", "credential"])
                  || value.version !== "music-identity/v1"
                  || !exactKeys(value.identity, ["musicUserId", "status"])
                  || !Number.isSafeInteger(value.identity.musicUserId) || value.identity.musicUserId < 1
                  || value.identity.status !== "active"
                  || !exactKeys(value.credential, ["token", "expiresAt"])
                  || typeof value.credential.token !== "string"
                  || value.credential.token.length < 64 || value.credential.token.length > 4_096
                  || !jwtPattern.test(value.credential.token)
                  || !Number.isSafeInteger(value.credential.expiresAt)
                  || value.credential.expiresAt <= nowMs) {
                throw new Error("credential response malformed");
              }
              return value.credential;
            }

            async function within(operation, timeoutMs, controller) {
              let timer;
              try {
                return await Promise.race([
                  operation,
                  new Promise((_, reject) => {
                    timer = setTimeout(() => {
                      controller.abort();
                      reject(new Error("probe deadline exceeded"));
                    }, timeoutMs);
                  }),
                ]);
              } finally {
                if (timer) clearTimeout(timer);
              }
            }

            async function probeEnsure({
              proof,
              fetchImpl = fetch,
              monotonicNow = () => performance.now(),
              wallNow = () => Date.now(),
              timeoutMs = 6_000,
            }) {
              const startedAt = monotonicNow();
              const controller = new AbortController();
              let response;
              try {
                response = await within(fetchImpl(new URL("/api/music/identity/ensure", "http://127.0.0.1:5000"), {
                  method: "POST",
                  headers: { authorization: `Bearer ${proof}` },
                  redirect: "error",
                  signal: controller.signal,
                }), timeoutMs, controller);
                const remaining = Math.max(1, timeoutMs - (monotonicNow() - startedAt));
                if (response.status !== 200) {
                  const statusCategory = response.status >= 400 && response.status < 500
                    ? "client_error"
                    : response.status >= 500 ? "server_error" : "transport_or_validation_error";
                  if (response.body && !response.body.locked) {
                    try { await within(Promise.resolve(response.body.cancel()), remaining, controller); }
                    catch {}
                  }
                  return { success: false, latencyMs: milliseconds(monotonicNow() - startedAt), statusCategory };
                }
                const text = await within(Promise.resolve(response.text()), remaining, controller);
                validateEnsurePayload(text, wallNow());
                return { success: true, latencyMs: milliseconds(monotonicNow() - startedAt), statusCategory: "success" };
              } catch {
                try {
                  if (response?.body && !response.body.locked) {
                    void Promise.resolve(response.body.cancel()).catch(() => undefined);
                  }
                } catch {}
                return {
                  success: false,
                  latencyMs: milliseconds(monotonicNow() - startedAt),
                  statusCategory: "transport_or_validation_error",
                };
              }
            }

            function evaluateSlo({ cold, warm, concurrent }) {
              const all = [...cold, ...warm, ...concurrent];
              const successCount = all.filter((entry) => entry.success).length;
              const successRatePercent = Math.round(successCount / all.length * 100_000) / 1_000;
              const gatewayProofCacheTtlColdP95Ms = milliseconds(percentile95(cold.map((entry) => entry.latencyMs)));
              const warmP95Ms = milliseconds(percentile95(warm.map((entry) => entry.latencyMs)));
              const concurrentP95Ms = milliseconds(percentile95(concurrent.map((entry) => entry.latencyMs)));
              const statusCategoryCounts = {
                success: 0,
                client_error: 0,
                server_error: 0,
                transport_or_validation_error: 0,
              };
              for (const entry of all) {
                if (Object.hasOwn(statusCategoryCounts, entry.statusCategory)) {
                  statusCategoryCounts[entry.statusCategory] += 1;
                } else {
                  statusCategoryCounts.transport_or_validation_error += 1;
                }
              }
              const passed = all.length === 200 && cold.length === 20 && warm.length === 90 && concurrent.length === 90
                && successRatePercent >= 99.5 && gatewayProofCacheTtlColdP95Ms <= 5000
                && warmP95Ms <= 1000 && concurrentP95Ms <= 1000
                && statusCategoryCounts.client_error === 0;
              return {
                passed,
                sampleCount: all.length,
                successCount,
                successRatePercent,
                gatewayProofCacheTtlColdP95Ms,
                warmP95Ms,
                concurrentP95Ms,
                statusCategoryCounts,
              };
            }

            async function runQualification({
              proof,
              probe = probeEnsure,
              sleepImpl = sleep,
              cacheTtlMs,
            }) {
              if (cacheTtlMs !== 30_000) throw new Error("unattested cache contract");
              const cold = [];
              const warm = [];
              const concurrent = [];
              for (let batchIndex = 0; batchIndex < batchPlans.length; batchIndex += 1) {
                const plan = batchPlans[batchIndex];
                cold.push(await probe({ proof }));
                for (let index = 0; index < plan.warm; index += 1) {
                  warm.push(await probe({ proof }));
                }
                concurrent.push(...await Promise.all(Array.from(
                  { length: plan.concurrent },
                  () => probe({ proof }),
                )));
                if (batchIndex < batchPlans.length - 1) await sleepImpl(cacheTtlMs + 1_000);
              }
              return { cold, warm, concurrent };
            }

            async function main() {
              const proof = process.env.MUSIC_SLO_STRAPI_USER_TOKEN;
              delete process.env.MUSIC_SLO_STRAPI_USER_TOKEN;
              const cacheTtlMs = Number(process.env.MUSIC_IDENTITY_CACHE_TTL_MS);
              const rateLimitPerMinute = Number(process.env.MUSIC_RATE_LIMIT_PER_MINUTE);
              if (typeof proof !== "string" || !/^[A-Za-z0-9._~-]{16,4096}$/.test(proof)
                  || cacheTtlMs !== 30_000 || rateLimitPerMinute !== 30) {
                throw new Error("unavailable qualification contract");
              }
              const qualification = await runQualification({ proof, cacheTtlMs });
              const evaluation = evaluateSlo(qualification);
              const { passed, ...metrics } = evaluation;
              finish({
                schemaVersion,
                outcome: passed ? "pass" : "fail",
                reason: passed ? "thresholds_met" : "threshold_failed",
                coldMode,
                restartCount: 1,
                ensureMutation,
                ...metrics,
              }, passed);
            }

            module.exports = { evaluateSlo, probeEnsure, runQualification, validateEnsurePayload };
            if (process.env.MUSIC_SLO_EXECUTE === "1") {
              main().catch(() => finish({
                schemaVersion,
                outcome: "failed_closed",
                reason: "probe_failed_closed",
                coldMode,
                restartCount: 1,
                ensureMutation,
              }, false));
            }
            NODE
            unset MUSIC_SLO_STRAPI_USER_TOKEN
            exit "$sampling_status"

  diagnose-last-attempt:
    if: github.ref == 'refs/heads/codex/tunes-fingerprint-diagnostic' && inputs.diagnose_last_attempt && !inputs.confirm_test_deploy && !inputs.run_authenticated_identity_slo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Inspect sanitized result without mutation
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          fingerprint: SHA256:mkzoRIglhalq6lNwNgM2kyuRLFGLeIbpLQpypShYMSw
          command_timeout: 2m
          script: |
            set -euo pipefail
            backup_dir=/home/deploy/tunes/tunes/deployment-backups
            readiness="$(find "$backup_dir" -maxdepth 1 -type f -name 'readiness-*.json' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
            candidate_log="$(find "$backup_dir" -maxdepth 1 -type f -name 'candidate-log-*.txt' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
            test -n "$readiness"
            printf '%s\n' '=== saved candidate readiness ==='
            cat "$readiness"
            printf '%s\n' '=== sanitized candidate startup log ==='
            test -n "$candidate_log"
            sed -E 's#://[^/@[:space:]]+@#://***@#g' "$candidate_log" | tail -n 120
            printf '%s\n' '=== current restored app ==='
            docker inspect --format 'image_id={{.Image}} configured_image={{.Config.Image}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1
            printf '%s\n' '=== current app environment names only ==='
            docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed 's/=.*//' | sort -u
            printf '%s\n' '=== current app mount destinations only ==='
            docker inspect tunes-app-1 --format '{{range .Mounts}}{{println .Type .Destination}}{{end}}' | sort -u
            printf '%s\n' '=== recent sanitized music identity outcomes ==='
            docker logs --since 30m tunes-app-1 2>&1 \
              | grep '"event":"music_identity_ensure"' \
              | sed -E 's#://[^/@[:space:]]+@#://***@#g' \
              | tail -n 50 || true
            printf '%s\n' '=== sanitized Strapi account collection contract ==='
            docker exec tunes-app-1 node -e '
              const base = process.env.STRAPI_URL;
              const token = process.env.STRAPI_ACCESS_TOKEN;
              fetch(new URL("/api/accounts?pagination[page]=1&pagination[pageSize]=50&pagination[withCount]=true", base), {
                headers: { authorization: `Bearer ${token}`, accept: "application/json" }
              }).then(async response => {
                const value = await response.json().catch(() => null);
                console.log(JSON.stringify({
                  status: response.status,
                  topKeys: value && typeof value === "object" ? Object.keys(value).sort() : [],
                  dataKind: Array.isArray(value?.data) ? "array" : typeof value?.data,
                  firstKeys: value?.data?.[0] && typeof value.data[0] === "object" ? Object.keys(value.data[0]).sort() : [],
                  pagination: value?.meta?.pagination ?? null
                }));
              }).catch(() => { console.log(JSON.stringify({ status: "network_error" })); process.exitCode = 1; });
            '
            printf '%s\n' '=== sanitized Strapi relation-filter contract ==='
            docker exec tunes-app-1 node -e '
              const base = process.env.STRAPI_URL;
              const headers = { authorization: `Bearer ${process.env.STRAPI_ACCESS_TOKEN}`, accept: "application/json" };
              const probe = async relation => {
                const params = new URLSearchParams({ [`filters[${relation}][documentId][$eq]`]: "diagnostic-nonexistent-document" });
                const response = await fetch(new URL(`/api/accounts?${params}`, base), { headers });
                await response.body?.cancel();
                return response.status;
              };
              Promise.all([probe("users_permissions_user"), probe("users_permissions_users")])
                .then(([singular, plural]) => console.log(JSON.stringify({ singular, plural })))
                .catch(() => { console.log(JSON.stringify({ status: "network_error" })); process.exitCode = 1; });
            '
            printf '%s\n' '=== compose services ==='
            cd /home/deploy/tunes/tunes
            docker compose -p tunes -f docker-compose.yml config --services
            db_user="$(docker inspect tunes-db-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_USER=//p' | head -n 1)"
            db_name="$(docker inspect tunes-db-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_DB=//p' | head -n 1)"
            test -n "$db_user"
            test -n "$db_name"
            printf '%s\n' '=== database role capabilities ==='
            docker exec tunes-db-1 psql -X -U "$db_user" -d "$db_name" -At -F '|' -c "SELECT rolname,rolcanlogin,rolsuper,rolcreaterole,rolcreatedb FROM pg_roles WHERE rolname IN ('music_runtime','music_runtime_login','music_migrator','postgres') ORDER BY rolname"
            printf '%s\n' '=== migration journal marker ==='
            docker exec tunes-db-1 psql -X -U "$db_user" -d "$db_name" -At -F '|' -c "SELECT CASE WHEN to_regclass('public.music_schema_migrations') IS NULL THEN 'absent' ELSE 'present' END"
            docker exec tunes-db-1 psql -X -U "$db_user" -d "$db_name" -At -F '|' -c "SELECT id FROM music_schema_migrations ORDER BY applied_at DESC LIMIT 3" 2>/dev/null || true
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/ >/dev/null
            printf '%s\n' 'public_endpoint=ok'

  build-arm64:
    if: github.ref == 'refs/heads/codex/tunes-fingerprint-diagnostic' && inputs.confirm_test_deploy && !inputs.run_authenticated_identity_slo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.repository }}@${{ steps.build.outputs.digest }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/explorers-tunes-test"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build immutable ARM64 candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./tunes
          file: ./tunes/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.commit }}
          build-args: |
            BUILD_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=tunes-test-arm64
          cache-to: type=gha,mode=max,scope=tunes-test-arm64

  deploy-test-server:
    needs: build-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - name: Back up, replace app, verify, and automatically roll back on failure
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          CANDIDATE_IMAGE: ${{ needs.build-arm64.outputs.image }}
          CANDIDATE_COMMIT: ${{ needs.build-arm64.outputs.commit }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          fingerprint: SHA256:mkzoRIglhalq6lNwNgM2kyuRLFGLeIbpLQpypShYMSw
          command_timeout: 12m
          envs: CANDIDATE_IMAGE,CANDIDATE_COMMIT,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            compose_dir=/home/deploy/tunes/tunes
            compose_file="$compose_dir/docker-compose.yml"
            override_file="$compose_dir/.codex-test-image.override.yml"
            backup_dir="$compose_dir/deployment-backups"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            rollback_image="local/tunes-app-rollback:$stamp"
            success_flag="$backup_dir/deploy-success-$stamp"
            heartbeat_file="$backup_dir/deploy-heartbeat-$stamp"
            watchdog_script="$backup_dir/watchdog-$stamp.sh"
            authority_dir="$compose_dir/.music-live-authority"
            attestation_dir="$authority_dir/attestations"
            cd "$compose_dir"
            test -f "$compose_file"
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' tunes-app-1)" = tunes
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' tunes-app-1)" = app
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' tunes-db-1)" = tunes
            test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' tunes-db-1)" = db
            test "$(docker inspect --format '{{.State.Status}}' tunes-db-1)" = running
            app_networks="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' tunes-app-1)"
            db_networks="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' tunes-db-1)"
            shared_network=false
            for network in $app_networks; do
              if printf '%s\n' "$db_networks" | grep -Fqw "$network"; then shared_network=true; shared_network_name="$network"; fi
            done
            test "$shared_network" = true
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            old_image_id="$(docker inspect --format '{{.Image}}' tunes-app-1)"
            docker tag "$old_image_id" "$rollback_image"
            printf '%s\n' "$old_image_id" > "$backup_dir/app-image-$stamp.txt"
            chmod 600 "$backup_dir/app-image-$stamp.txt"
            db_user="$(docker inspect tunes-db-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_USER=//p' | head -n 1)"
            test -n "$db_user"
            umask 077
            docker exec tunes-db-1 pg_dumpall -U "$db_user" | gzip -9 > "$backup_dir/postgres-$stamp.sql.gz"
            test -s "$backup_dir/postgres-$stamp.sql.gz"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            cleanup() {
              docker logout ghcr.io >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            docker pull "$CANDIDATE_IMAGE"
            test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Architecture}}')" = arm64
            test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CANDIDATE_COMMIT"
            write_rollback_override() {
              image="$1"
              printf 'services:\n  app:\n    image: %s\n    pull_policy: never\n' "$image" > "$override_file"
              chmod 600 "$override_file"
            }
            install -d -m 700 "$authority_dir" "$attestation_dir"
            create_authority() {
              target="$1"
              if [ ! -s "$target" ]; then openssl rand -hex 24 > "$target"; fi
              chmod 600 "$target"
              test "$(wc -c < "$target")" -ge 43
            }
            create_authority "$authority_dir/db-migrator"
            create_authority "$authority_dir/db-runtime"
            create_authority "$authority_dir/music-token"
            create_authority "$authority_dir/publication-response"
            if [ "$(wc -c < "$authority_dir/publication-response")" -ne 43 ]; then
              openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n' > "$authority_dir/publication-response"
              chmod 600 "$authority_dir/publication-response"
            fi
            test "$(wc -c < "$authority_dir/publication-response")" -eq 43
            create_authority "$authority_dir/lifecycle-proof"
            create_authority "$authority_dir/strapi-jwt"
            create_authority "$authority_dir/gate-key"
            create_authority "$authority_dir/session-secret"
            create_authority "$authority_dir/cookie-secret"
            db_name="$(docker inspect tunes-db-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^POSTGRES_DB=//p' | head -n 1)"
            test -n "$db_name"
            migrator_password="$(cat "$authority_dir/db-migrator")"
            docker exec -i tunes-db-1 psql -X -v ON_ERROR_STOP=1 -U "$db_user" -d "$db_name" \
              -v password="$migrator_password" -v legacy_owner="$db_user" -v database_name="$db_name" <<'SQL'
            DO $$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='music_migrator') THEN
                CREATE ROLE music_migrator LOGIN SUPERUSER CREATEROLE CREATEDB;
              END IF;
            END $$;
            ALTER ROLE music_migrator WITH LOGIN SUPERUSER CREATEROLE CREATEDB PASSWORD :'password';
            SELECT format('ALTER %s %I.%I OWNER TO music_migrator',
              CASE relkind WHEN 'S' THEN 'SEQUENCE' WHEN 'v' THEN 'VIEW'
                WHEN 'm' THEN 'MATERIALIZED VIEW' WHEN 'f' THEN 'FOREIGN TABLE' ELSE 'TABLE' END,
              nspname,relname)
            FROM pg_class JOIN pg_namespace ON pg_namespace.oid=pg_class.relnamespace
            WHERE nspname='public' AND relkind IN ('r','p','S','v','m','f')
            ORDER BY relkind,relname;
            \gexec
            SELECT format('ALTER FUNCTION %s OWNER TO music_migrator',oid::regprocedure)
            FROM pg_proc WHERE pronamespace='public'::regnamespace ORDER BY oid;
            \gexec
            ALTER DATABASE :"database_name" OWNER TO music_migrator;
            SQL
            candidate_digest="${CANDIDATE_IMAGE##*@}"
            docker run --rm --user "$(id -u):$(id -g)" --network "$shared_network_name" \
              --entrypoint node \
              -e MUSIC_MODE=live -e MUSIC_DATABASE_HOST=db -e MUSIC_DATABASE_PORT=5432 \
              -e MUSIC_DATABASE_NAME="$db_name" -e MUSIC_DATABASE_USER=music_migrator \
              -e MUSIC_DATABASE_PASSWORD_FILE=/run/secrets/db-migrator \
              -e MUSIC_RUNTIME_DATABASE_USER=music_runtime_login \
              -e MUSIC_RUNTIME_DATABASE_PASSWORD_FILE=/run/secrets/db-runtime \
              -e MUSIC_IMAGE_DIGEST="$candidate_digest" -e MUSIC_IMAGE_COMMIT="$CANDIDATE_COMMIT" \
              -e MUSIC_MIGRATION_MARKER=0017_publication_idempotency_key_retirement \
              -e MUSIC_GATE_ATTESTATION_KEY="$(cat "$authority_dir/gate-key")" \
              -e MUSIC_GATE_ATTESTATION_PATH="/deployment-gates/$candidate_digest.json" \
              -v "$authority_dir/db-migrator:/run/secrets/db-migrator:ro" \
              -v "$authority_dir/db-runtime:/run/secrets/db-runtime:ro" \
              -v "$attestation_dir:/deployment-gates" \
              "$CANDIDATE_IMAGE" dist/server/deployment/run-migration-gate.js
            proxy_ip="$(docker network inspect "$shared_network_name" --format '{{(index .IPAM.Config 0).Gateway}}')"
            strapi_url="$(docker inspect tunes-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^STRAPI_URL=//p' | head -n 1)"
            test -n "$strapi_url"
            strapi_origin="$(printf '%s' "$strapi_url" | sed -E 's#^(https://[^/]+).*$#\1#')"
            test "${strapi_origin#https://}" != "$strapi_origin"
            write_candidate_override() {
              cat > "$override_file" <<EOF
            services:
              app:
                image: $CANDIDATE_IMAGE
                pull_policy: never
                user: "$(id -u):$(id -g)"
                environment:
                  DATABASE_URL: ""
                  MUSIC_MODE: live
                  MUSIC_DATABASE_HOST: db
                  MUSIC_DATABASE_PORT: "5432"
                  MUSIC_DATABASE_NAME: $db_name
                  MUSIC_DATABASE_USER: music_runtime_login
                  MUSIC_DATABASE_MIGRATOR_USER: music_migrator
                  MUSIC_DATABASE_PASSWORD_FILE: /run/secrets/music-db-runtime
                  MUSIC_STRAPI_ALLOWED_ORIGINS: $strapi_origin
                  TRUST_PROXY_HOPS: "1"
                  MUSIC_TRUSTED_PROXY_IP: $proxy_ip
                  STRAPI_LIFECYCLE_PROOF_TOKEN_FILE: /run/secrets/lifecycle-proof
                  STRAPI_JWT_SECRET: $(cat "$authority_dir/strapi-jwt")
                  SESSION_SECRET: $(cat "$authority_dir/session-secret")
                  COOKIE_SECRET: $(cat "$authority_dir/cookie-secret")
                  MUSIC_GATE_ATTESTATION_KEY: $(cat "$authority_dir/gate-key")
                  MUSIC_DEPLOYMENT_HEALTH_ENABLED: "true"
                  MUSIC_NEW_ENTRY_KILL_SWITCH: "false"
                  MUSIC_COHORT_ENABLED: "false"
                  MUSIC_CONNECT_TIMEOUT_MS: "5000"
                  MUSIC_READ_TIMEOUT_MS: "10000"
                  MUSIC_IDENTITY_OVERALL_TIMEOUT_MS: "15000"
                  MUSIC_TOKEN_CURRENT_KID: test-current-v1
                  MUSIC_TOKEN_CURRENT_SECRET_FILE: /run/secrets/music-token
                  MUSIC_TOKEN_LIFETIME_SECONDS: "600"
                  MUSIC_TOKEN_CLOCK_SKEW_SECONDS: "15"
                  MUSIC_PUBLICATION_RESPONSE_CURRENT_KID: test-publication-v1
                  MUSIC_PUBLICATION_RESPONSE_CURRENT_KEY_FILE: /run/secrets/publication-response
                  MUSIC_IMAGE_DIGEST: $candidate_digest
                  MUSIC_IMAGE_COMMIT: $CANDIDATE_COMMIT
                  MUSIC_MIGRATION_MARKER: 0017_publication_idempotency_key_retirement
                  MUSIC_GATE_ATTESTATION_PATH: /deployment-gates/$candidate_digest.json
                volumes:
                  - $authority_dir/db-runtime:/run/secrets/music-db-runtime:ro
                  - $authority_dir/music-token:/run/secrets/music-token:ro
                  - $authority_dir/publication-response:/run/secrets/publication-response:ro
                  - $authority_dir/lifecycle-proof:/run/secrets/lifecycle-proof:ro
                  - $attestation_dir:/deployment-gates:ro
            EOF
              chmod 600 "$override_file"
            }
            cat > "$watchdog_script" <<EOF
            #!/usr/bin/env bash
            set -euo pipefail
            rollback_verified=false
            for attempt in \$(seq 1 180); do
              test -f "$success_flag" && exit 0
              now=\$(date +%s)
              heartbeat=\$(cat "$heartbeat_file" 2>/dev/null || printf '0')
              if (( now - heartbeat <= 120 )); then sleep 5; continue; fi
              printf 'services:\n  app:\n    image: %s\n    pull_policy: never\n' "$rollback_image" > "$override_file"
              chmod 600 "$override_file"
              for retry in \$(seq 1 3); do
                docker compose -p tunes -f "$compose_file" -f "$override_file" up -d --no-deps --force-recreate app || true
                for check in \$(seq 1 30); do
                  image=\$(docker inspect --format '{{.Image}}' tunes-app-1 2>/dev/null || true)
                  state=\$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)
                  health=\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1 2>/dev/null || true)
                  if [ "\$image" = "$old_image_id" ] && [ "\$state" = running ] && { [ "\$health" = healthy ] || [ "\$health" = none ]; } && curl --fail --silent --max-time 5 http://127.0.0.1:5001/ >/dev/null; then rollback_verified=true; break 3; fi
                  sleep 2
                done
              done
              break
            done
            if [ "\$rollback_verified" != true ]; then touch "$backup_dir/WATCHDOG-ROLLBACK-FAILED-$stamp"; exit 1; fi
            EOF
            chmod 700 "$watchdog_script"
            date +%s > "$heartbeat_file"
            nohup bash "$watchdog_script" > "$backup_dir/watchdog-$stamp.log" 2>&1 &
            rollback() {
              status=$?
              trap - ERR
              echo 'Candidate verification failed; restoring retained application image.'
              docker logs --tail 300 tunes-app-1 > "$backup_dir/candidate-log-$stamp.txt" 2>&1 || true
              curl --silent --show-error --max-time 5 http://127.0.0.1:5001/health/ready > "$backup_dir/readiness-$stamp.json" || true
              write_rollback_override "$rollback_image"
              for retry in $(seq 1 3); do
                date +%s > "$heartbeat_file"
                timeout 90s docker compose -p tunes -f "$compose_file" -f "$override_file" up -d --no-deps --force-recreate app || true
                for attempt in $(seq 1 30); do
                  image="$(docker inspect --format '{{.Image}}' tunes-app-1 2>/dev/null || true)"
                  state="$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)"
                  health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1 2>/dev/null || true)"
                  if [ "$image" = "$old_image_id" ] && [ "$state" = running ] && { [ "$health" = healthy ] || [ "$health" = none ]; } && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/ >/dev/null; then
                    touch "$success_flag"
                    echo 'Rollback verified.'
                    exit "$status"
                  fi
                  sleep 2
                done
              done
              echo 'Rollback container did not recover the public endpoint.'
              exit 1
            }
            trap rollback ERR
            write_candidate_override
            date +%s > "$heartbeat_file"
            timeout 90s docker compose -p tunes -f "$compose_file" -f "$override_file" up -d --no-deps --force-recreate app
            for attempt in $(seq 1 45); do
              date +%s > "$heartbeat_file"
              state="$(docker inspect --format '{{.State.Status}}' tunes-app-1 2>/dev/null || true)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' tunes-app-1 2>/dev/null || true)"
              if [ "$state" = running ] && [ "$health" = healthy ] && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/health/live >/dev/null && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/health/ready > "$backup_dir/readiness-$stamp.json" && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/ >/dev/null; then
                break
              fi
              test "$attempt" -lt 45
              sleep 2
            done
            test "$(docker inspect --format '{{.Config.Image}}' tunes-app-1)" = "$CANDIDATE_IMAGE"
            docker run --rm --entrypoint node -v "$backup_dir/readiness-$stamp.json:/readiness.json:ro" --env EXPECTED_COMMIT="$CANDIDATE_COMMIT" --env EXPECTED_DIGEST="$candidate_digest" "$CANDIDATE_IMAGE" -e '
              const fs=require("node:fs");
              const value=JSON.parse(fs.readFileSync("/readiness.json","utf8"));
              if(value.ready!==true||value.commit!==process.env.EXPECTED_COMMIT||value.digest!==process.env.EXPECTED_DIGEST||value.migrationMarker!=="0017_publication_idempotency_key_retirement")process.exit(1);
            '
            touch "$success_flag"
            trap - ERR
            printf 'deployed_commit=%s\n' "$CANDIDATE_COMMIT"
            printf 'deployed_image=%s\n' "$CANDIDATE_IMAGE"
            printf 'database_backup=%s\n' "$backup_dir/postgres-$stamp.sql.gz"
            printf 'rollback_image=%s\n' "$rollback_image"
