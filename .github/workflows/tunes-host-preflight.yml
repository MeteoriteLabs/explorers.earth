name: Tunes read-only host preflight

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm that this run may inspect sanitized host metadata"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: tunes-host-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/codex/tunes-fingerprint-diagnostic' && inputs.confirm_read_only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect Tunes host without mutation
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.TUNES_DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.TUNES_DEPLOY_KEY }}
          port: 22
          command_timeout: 2m
          script_stop: true
          script: |
            set -euo pipefail
            printf '%s\n' '=== identity ==='
            id
            uname -a
            printf '%s\n' '=== ssh host fingerprints ==='
            ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub
            ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
            ssh-keygen -lf /etc/ssh/ssh_host_rsa_key.pub
            printf '%s\n' '=== legacy app identity ==='
            docker inspect --format 'name={{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} networks={{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' tunes-app-1
            printf '%s\n' '=== listeners ==='
            ss -lnt
            printf '%s\n' '=== ingress services ==='
            for service in nginx caddy traefik; do
              if systemctl is-active --quiet "$service"; then printf 'active=%s\n' "$service"; else printf 'active=no service=%s\n' "$service"; fi
            done
            printf '%s\n' '=== provisioning authority ==='
            if sudo -n true; then printf '%s\n' 'sudo_nopasswd=yes'; else printf '%s\n' 'sudo_nopasswd=no'; fi
