name: 🚀 Build & Deploy to Hetzner

on:
  push:
    branches:
      - main
  # Allow manual triggers from the GitHub Actions UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build Docker Images & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push images to GHCR

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image names
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "TUNES_IMAGE=ghcr.io/${OWNER_LC}/tunes" >> $GITHUB_ENV
          echo "EXPLORERS_IMAGE=ghcr.io/${OWNER_LC}/explorers-earth" >> $GITHUB_ENV

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗂️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push: tunes ───────────────────────────────────────────────
      - name: 🎵 Build and push tunes image
        uses: docker/build-push-action@v6
        with:
          context: ./tunes
          file: ./tunes/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.TUNES_IMAGE }}:latest
            ${{ env.TUNES_IMAGE }}:${{ github.sha }}
          # VITE_ vars are baked into the frontend bundle at build time.
          # These are stored as GitHub Secrets — NOT runtime env vars.
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_REST_API_URL=${{ secrets.VITE_REST_API_URL }}
            VITE_PUBLIC_ACCESS_TOKEN=${{ secrets.VITE_PUBLIC_ACCESS_TOKEN }}
            VITE_CLARITY_PROJECT_ID=${{ secrets.VITE_CLARITY_PROJECT_ID }}
          # Use GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha,scope=tunes
          cache-to: type=gha,mode=max,scope=tunes

      # ── Build & Push: explorers-earth ─────────────────────────────────────
      - name: 🌍 Build and push explorers-earth image
        uses: docker/build-push-action@v6
        with:
          context: ./explorers-earth
          file: ./explorers-earth/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.EXPLORERS_IMAGE }}:latest
            ${{ env.EXPLORERS_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.EXPLORERS_VITE_API_URL }}
            VITE_REST_API_URL=${{ secrets.EXPLORERS_VITE_REST_API_URL }}
            VITE_PUBLIC_ACCESS_TOKEN=${{ secrets.EXPLORERS_VITE_PUBLIC_ACCESS_TOKEN }}
            VITE_LOCAL_TUNES_URL=https://localtunes.earth
          cache-from: type=gha,scope=explorers-earth
          cache-to: type=gha,mode=max,scope=explorers-earth

  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to Hetzner
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚢 SSH into server and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Exit immediately if any command fails
          script_stop: true
          script: |
            set -e

            echo "🔄 Navigating to app directory..."
            cd /opt/app

            echo "📦 Pulling latest code from main..."
            git pull origin main

            echo "🔑 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🐳 Setting image tag to git SHA: ${{ github.sha }}"
            # Export vars so docker-compose.yml can interpolate them
            export IMAGE_TAG=${{ github.sha }}
            export GITHUB_REPOSITORY_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            echo "⬇️  Pulling new images..."
            docker compose pull tunes explorers

            echo "🔁 Restarting app containers (zero-downtime swap)..."
            # --no-deps ensures DB and Traefik are NOT restarted
            docker compose up -d --no-deps tunes explorers

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Deployment complete at $(date)"
            echo "   tunes image:    ${{ env.TUNES_IMAGE }}:${{ github.sha }}"
            echo "   explorers image: ${{ env.EXPLORERS_IMAGE }}:${{ github.sha }}"
