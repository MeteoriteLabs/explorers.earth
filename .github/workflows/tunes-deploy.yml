name: Tunes production deploy authority

on:
  workflow_call:
    inputs:
      digest: { type: string, required: true }
      commit: { type: string, required: true }
  workflow_dispatch:
    inputs:
      target_digest:
        description: "Previously retained secure digest to roll back to"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: tunes-production-deploy
  cancel-in-progress: false

jobs:
  production-authority-preflight:
    # Non-main dispatches always run and fail this no-secret job. On main, the
    # external-policy API check is required only when production is enabled.
    if: github.ref != 'refs/heads/main' || vars.GATE_PROD == 'open'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tunes/deployment/verify-production-environment-policy.mjs
          sparse-checkout-cone-mode: false
      - name: Require main as the sole protected production branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tunes/deployment/verify-production-environment-policy.mjs

  deploy:
    # GATE-PROD remains closed until external runtime evidence and explicit
    # production authorization set this repository variable to exactly `open`.
    needs: production-authority-preflight
    if: needs.production-authority-preflight.result == 'success' && github.ref == 'refs/heads/main' && vars.GATE_PROD == 'open'
    environment: tunes-production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tunes/deployment/music-deploy.sh
            tunes/deployment/music-deploy-engine.sh
            tunes/deployment/music-hmac.mjs
            tunes/deployment/verify-publication-authority.mjs
          sparse-checkout-cone-mode: false

      - name: Derive and verify immutable request
        id: request
        shell: bash
        env:
          CALL_DIGEST: ${{ inputs.digest }}
          CALL_COMMIT: ${{ inputs.commit }}
          ROLLBACK_DIGEST: ${{ inputs.target_digest }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9]([a-z0-9_.-]{0,37}[a-z0-9])?$ ]]
          IMAGE_REPOSITORY="ghcr.io/${owner}/explorers-tunes"
          IMAGE_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            operation=rollback
            digest="$ROLLBACK_DIGEST"
            commit=-
          else
            [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/tunes.yml@refs/heads/main" ]]
            operation=deploy
            digest="$CALL_DIGEST"
            commit="$CALL_COMMIT"
            [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            echo "operation=$operation"
            echo "digest=$digest"
            echo "commit=$commit"
            echo "repository=$IMAGE_REPOSITORY"
            echo "source=$IMAGE_SOURCE"
          } >> "$GITHUB_OUTPUT"

      - name: Verify GitHub build provenance for normal deploy
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ steps.request.outputs.repository }}
          DIGEST: ${{ steps.request.outputs.digest }}
        run: gh attestation verify "${IMAGE_REPOSITORY}@${DIGEST}" --repo "$GITHUB_REPOSITORY"

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Run checked-in transactional deploy executable
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          GHCR_DEPLOY_USER: ${{ secrets.GHCR_DEPLOY_USER }}
          GHCR_DEPLOY_READ_TOKEN: ${{ secrets.GHCR_DEPLOY_READ_TOKEN }}
          MUSIC_DEPLOY_STATE_HMAC_KEY: ${{ secrets.MUSIC_DEPLOY_STATE_HMAC_KEY }}
          OPERATION: ${{ steps.request.outputs.operation }}
          DIGEST: ${{ steps.request.outputs.digest }}
          COMMIT: ${{ steps.request.outputs.commit }}
          IMAGE_REPOSITORY: ${{ steps.request.outputs.repository }}
          IMAGE_SOURCE: ${{ steps.request.outputs.source }}
        run: |
          set -euo pipefail
          hmac_key_value="$MUSIC_DEPLOY_STATE_HMAC_KEY"
          unset MUSIC_DEPLOY_STATE_HMAC_KEY
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^([A-Za-z0-9][A-Za-z0-9.-]{0,252}|[0-9a-fA-F:]+)$ ]]
          [[ "$GHCR_DEPLOY_USER" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ ${#hmac_key_value} -ge 32 ]]
          bundle="$(mktemp -d)"
          archive="$(mktemp)"
          cleanup() {
            rm -f -- "$bundle/music-deploy.sh" "$bundle/music-deploy-engine.sh" "$bundle/music-hmac.mjs" "$bundle/verify-publication-authority.mjs" "$bundle/request.txt" "$bundle/authority.txt" \
              "$bundle/hmac.key" "$bundle/ghcr.token" "$archive"
            rmdir -- "$bundle" 2>/dev/null || true
          }
          trap cleanup EXIT
          install -m 700 tunes/deployment/music-deploy.sh "$bundle/music-deploy.sh"
          install -m 700 tunes/deployment/music-deploy-engine.sh "$bundle/music-deploy-engine.sh"
          install -m 600 tunes/deployment/music-hmac.mjs "$bundle/music-hmac.mjs"
          install -m 600 tunes/deployment/verify-publication-authority.mjs "$bundle/verify-publication-authority.mjs"
          printf '%s\n' music-deploy-request-v2 "operation=$OPERATION" "digest=$DIGEST" "commit=$COMMIT" compose_project=- legacy_service=- > "$bundle/request.txt"
          printf '%s\n' music-deploy-authority-v1 "repository=$IMAGE_REPOSITORY" "source=$IMAGE_SOURCE" "ghcr_user=$GHCR_DEPLOY_USER" > "$bundle/authority.txt"
          printf '%s' "$hmac_key_value" > "$bundle/hmac.key"
          unset hmac_key_value
          printf '%s' "$GHCR_DEPLOY_READ_TOKEN" > "$bundle/ghcr.token"
          chmod 600 "$bundle"/*
          tar -C "$bundle" -czf - . | base64 -w0 > "$archive"
          # Only base64 reaches stdin. The remote command is fixed text: no caller
          # input, digest, commit, package owner, or secret is interpolated into it.
          ssh -i "$HOME/.ssh/id_ed25519" "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -euo pipefail
            incoming="$(mktemp -d /opt/explorers/deployment-transactions/incoming.XXXXXX)"
            cleanup() {
              rm -f -- "$incoming/music-deploy.sh" "$incoming/music-deploy-engine.sh" "$incoming/music-hmac.mjs" "$incoming/verify-publication-authority.mjs" "$incoming/request.txt" "$incoming/authority.txt" \
                "$incoming/hmac.key" "$incoming/ghcr.token"
              rmdir -- "$incoming" 2>/dev/null || true
            }
            trap cleanup EXIT
            base64 -d | tar -xzf - -C "$incoming"
            chmod 700 "$incoming/music-deploy.sh" "$incoming/music-deploy-engine.sh"
            chmod 600 "$incoming/music-hmac.mjs" "$incoming/verify-publication-authority.mjs" "$incoming/request.txt" "$incoming/authority.txt" "$incoming/hmac.key" "$incoming/ghcr.token"
            MUSIC_DEPLOY_REQUEST_FILE="$incoming/request.txt" \
            MUSIC_DEPLOY_AUTHORITY_FILE="$incoming/authority.txt" \
            MUSIC_DEPLOY_HMAC_KEY_FILE="$incoming/hmac.key" \
            MUSIC_DEPLOY_HMAC_HELPER_FILE="$incoming/music-hmac.mjs" \
            MUSIC_PUBLICATION_AUTHORITY_HELPER_FILE="$incoming/verify-publication-authority.mjs" \
            MUSIC_DEPLOY_GHCR_TOKEN_FILE="$incoming/ghcr.token" \
            MUSIC_DEPLOY_EPHEMERAL_CREDENTIAL_FILES=1 \
            bash "$incoming/music-deploy.sh"
          ' < "$archive"
