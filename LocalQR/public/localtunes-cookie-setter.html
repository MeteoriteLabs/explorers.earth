<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalTunes Cookie Setter</title>
</head>

<body>
    <script>
        // LocalTunes Cookie Setter Handler
        // This page handles setting cookies for cross-domain SSO

        console.log('🍪 LocalTunes cookie setter page loaded');

        // Notify parent window that we're ready to receive cookie data
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'LOCALTUNES_COOKIE_READY',
                timestamp: Date.now()
            }, '*');

            console.log('📡 Notified parent window that cookie setter is ready');
        }

        // Listen for cookie data from explorers
        window.addEventListener('message', function (event) {
            // Security: Only accept messages from localhost:5173 (explorers)
            if (event.origin !== 'http://localhost:5173' && event.origin !== 'https://localhost:5173') {
                console.log('⚠️ Rejected message from unauthorized origin:', event.origin);
                return;
            }

            if (event.data.type === 'LOCALTUNES_SET_COOKIE') {
                console.log('🍪 Received cookie data from explorers');

                const { cookieName, cookieValue, expires } = event.data;

                try {
                    // Set the cookie for localtunes.earth
                    document.cookie = `${cookieName}=${encodeURIComponent(cookieValue)}; Domain=localhost; Path=/; Expires=${expires}; SameSite=Lax`;

                    console.log('✅ Cookie set for localtunes.earth:', cookieName);
                    console.log('📦 Cookie value:', cookieValue.substring(0, 100) + '...');

                    // Also store in localStorage for immediate access
                    localStorage.setItem('localtunes_cross_domain_auth', cookieValue);

                    console.log('✅ Cross-domain auth data also stored in localStorage');

                    // Notify parent of success
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'LOCALTUNES_COOKIE_SET',
                            success: true,
                            cookieName: cookieName
                        }, '*');
                    }

                } catch (error) {
                    console.error('❌ Failed to set cookie:', error);

                    // Notify parent of failure
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: 'LOCALTUNES_COOKIE_SET',
                            success: false,
                            error: error.message
                        }, '*');
                    }
                }
            }
        });

        // Handle page load completion
        window.addEventListener('load', function () {
            console.log('✅ LocalTunes cookie setter page fully loaded');
        });

        // Handle errors
        window.addEventListener('error', function (event) {
            console.error('❌ Cookie setter page error:', event.error);
        });
    </script>

    <div style="display: none;">
        <!-- Hidden content for cookie setter -->
        <p>LocalTunes Cookie Setter Handler</p>
        <p>This page handles setting cookies for cross-domain SSO from explorers.</p>
    </div>
</body>

</html>
