# Grype configuration for the BLOCKING image scan only.
#
# The "Report all high and critical image vulnerabilities" step in
# .github/workflows/tunes.yml deliberately does NOT use this file, so the retained
# SARIF report keeps listing everything below. This narrows what *fails the build*,
# not what we are told about.
#
# Why these entries exist
# -----------------------
# tunes/Dockerfile installs chromium plus its codec dependencies because
# tunes/server/utils/scrapeUtils.ts drives Puppeteer with the stealth plugin inside
# the API image. On 2026-10-06 that accounted for 248 of 257 high-or-critical
# findings: 176 from chromium and 72 from the ffmpeg-* codec libraries. Only three
# findings came from application dependencies, and those were fixed in the lockfile
# rather than suppressed here.
#
# The Dockerfile already runs `apk upgrade --no-cache`, keyed on BUILD_COMMIT so a
# remote build cache cannot stale it, which means the installed chromium is already
# the newest the pinned Alpine branch offers. There is no base-image bump available
# that clears these while chromium remains in the production image.
#
# What this does NOT excuse
# -------------------------
# These rules are scoped to named apk packages. Every other package, including every
# application dependency, still fails the build at high or above - the same gate
# caught qs, source-map-js and braces on the day this file was written.
#
# The real fix is to stop shipping a browser in the production API image by moving
# the Puppeteer scraper into its own job or service. Until that lands, this file
# keeps the gate useful for everything else instead of being switched off.
#
# Expiry
# ------
# x-review-by is enforced by a test, so this suppression cannot quietly become
# permanent: tunes/server/test/deployment/music-deploy-workflow-security.test.ts
# fails once the date passes, which forces a deliberate decision to extend it or
# remove it.
x-review-by: "2026-12-31"
x-owner: "replatform"
x-tracking: "Move the Puppeteer scraper out of the production API image."

ignore:
  # Browser engine, present only for the Puppeteer scraper.
  - package:
      name: chromium
      type: apk
  # Codec libraries pulled in by chromium.
  - package:
      name: ffmpeg-libavcodec
      type: apk
  - package:
      name: ffmpeg-libavformat
      type: apk
  - package:
      name: ffmpeg-libavutil
      type: apk
  - package:
      name: ffmpeg-libswresample
      type: apk
